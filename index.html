  <script src="/_sdk/b23f1f6ec78e9bd4.editing_sdk.js" integrity="sha512-WFdQutvUZzxrmcHkL8cbfuFDTeF8Cn8Bt3yqX/a/OdiqPz/t9UcjsIsZK7D+tMTmC2JTwhwRJNyfcHmIWhG8Wg=="></script>
  <script>
    lucide.createIcons();

    // Color swatch selection
    document.querySelectorAll('.product-card').forEach(card => {
      card.querySelectorAll('.color-swatch').forEach(swatch => {
        swatch.addEventListener('click', (e) => {
          e.stopPropagation();
          card.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
          swatch.classList.add('active');
        });
      });
    });

    // Cart state
    let cart = [];
    const cartBtn = document.getElementById('cart-btn');
    const cartPanel = document.getElementById('cart-panel');
    const cartOverlay = document.getElementById('cart-overlay');
    const cartClose = document.getElementById('cart-close');
    const cartCountEl = document.getElementById('cart-count');
    const cartItemsEl = document.getElementById('cart-items');
    const cartTotalEl = document.getElementById('cart-total');

    function openCart() { cartPanel.classList.add('open'); cartOverlay.classList.add('open'); }
    function closeCart() { cartPanel.classList.remove('open'); cartOverlay.classList.remove('open'); }
    cartBtn.addEventListener('click', openCart);
    cartClose.addEventListener('click', closeCart);
    cartOverlay.addEventListener('click', closeCart);

    function updateCart() {
      cartCountEl.textContent = cart.length;
      cartCountEl.classList.toggle('hidden', cart.length === 0);
      cartItemsEl.innerHTML = cart.map((item, i) => `
        <div class="flex justify-between items-center">
          <div><span class="text-sm">${item.name}</span><span class="text-xs text-stone-400 ml-2">(${item.color})</span></div>
          <div class="flex items-center gap-3">
            <span class="text-sm font-display">${item.price}</span>
            <button onclick="removeItem(${i})" class="text-stone-400 hover:text-stone-700"><i data-lucide="x" style="width:14px;height:14px"></i></button>
          </div>
        </div>
      `).join('');
      const total = cart.reduce((s, i) => s + parseInt(i.price.replace(/[^\d]/g, '')), 0);
      cartTotalEl.textContent = '€' + total.toLocaleString();
      lucide.createIcons();
    }

    window.removeItem = function(i) { cart.splice(i, 1); updateCart(); };

    document.querySelectorAll('.add-to-bag').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const card = e.target.closest('[data-product]');
        const activeColor = card.querySelector('.color-swatch.active');
        const colorName = activeColor ? activeColor.dataset.color : '';
        cart.push({ name: card.dataset.product, price: card.dataset.price, color: colorName });
        updateCart();
        openCart();
      });
    });

    document.getElementById('checkout-form').addEventListener('submit', (e) => e.preventDefault());

    document.querySelector('[data-template-id="checkout-btn"]').addEventListener('click', () => {
      const form = document.getElementById('checkout-form');
      if (!form.checkValidity()) { form.reportValidity(); return; }
      if (cart.length === 0) return;
      document.getElementById('demo-notice').classList.remove('hidden');
    });

    // Parallax
    window.addEventListener('scroll', () => {
      const y = window.scrollY;
      document.getElementById('hero-parallax').style.transform = `translateY(${y * 0.3}px)`;
      const craft = document.getElementById('craft-parallax');
      const rect = craft.parentElement.getBoundingClientRect();
      if (rect.top < window.innerHeight && rect.bottom > 0) {
        craft.style.transform = `translateY(${(rect.top - window.innerHeight) * -0.2}px)`;
      }
    });

    // Fade in
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry, i) => {
        if (entry.isIntersecting) {
          setTimeout(() => entry.target.classList.add('visible'), i * 120);
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
  </script>
